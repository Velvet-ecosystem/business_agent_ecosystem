[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velvet-business-operations"
version = "0.1.0"
description = "Offline-first, authority-gated business operations for Velvet Unified-Organ AI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["velvet", "offline-first", "business-operations", "authority", "receipts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/Velvet-ecosystem/business_agent_ecosystem"
Issues = "https://github.com/Velvet-ecosystem/business_agent_ecosystem/issues"

[tool.setuptools.packages.find]
include = ["business_agents*"]
exclude = ["docs*", "examples*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
